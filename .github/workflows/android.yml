name: Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PROJECT: src/DnDManager.Mobile/DnDManager.Mobile.csproj
      TARGETS: net10.0-android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '17'

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Installa workload MAUI Android
        run: dotnet workload install maui-android

      - name: Installa dipendenze Android SDK
        run: dotnet build $PROJECT -p:MobileTargets=$TARGETS -t:InstallAndroidDependencies -f net10.0-android -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True

      - name: Prepara keystore di firma (se configurato)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nessun keystore nei secrets: build firmata con chiave di debug (non caricabile su Play)."
          fi

      - name: Publish (AAB + APK)
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          SIGN_ARGS=""
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            SIGN_ARGS="-p:AndroidKeyStore=true -p:AndroidSigningKeyStore=$RUNNER_TEMP/upload.keystore -p:AndroidSigningStorePass=env:KS_PASS -p:AndroidSigningKeyAlias=$KEY_ALIAS -p:AndroidSigningKeyPass=env:KEY_PASS"
          fi
          dotnet publish $PROJECT -p:MobileTargets=$TARGETS -f net10.0-android -c Release \
            -p:ApplicationVersion=${{ github.run_number }} \
            "-p:AndroidPackageFormats=\"aab;apk\"" \
            $SIGN_ARGS -o out 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Riepilogo errori di build
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          grep -E -A6 "error|ILLink|Unhandled exception" build.log | cut -c1-400 | awk '!seen[$0]++' | head -120 > errors.txt || true
          if [ -s errors.txt ]; then
            MSG=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' errors.txt)
            echo "::error title=Errori di compilazione::$MSG"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ github.run_number }}
          path: |
            out/*.aab
            out/*-Signed.apk
