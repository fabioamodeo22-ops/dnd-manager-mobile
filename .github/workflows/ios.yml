name: iOS

# I minuti macOS costano 10x nei repo privati: questa pipeline parte solo a mano (Actions -> iOS -> Run workflow)
on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Firma e carica su TestFlight (richiede i secrets Apple)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      PROJECT: src/DnDManager.Mobile/DnDManager.Mobile.csproj
      TARGETS: net10.0-ios
    steps:
      - uses: actions/checkout@v5

      # Il workload .NET per iOS richiede l'Xcode della stessa generazione dell'SDK (es. .NET iOS 27.x -> Xcode 27)
      - name: Seleziona l'Xcode più recente
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "Uso $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Installa workload MAUI iOS
        run: dotnet workload install maui-ios

      - name: Build di verifica (simulatore, senza firma)
        if: ${{ !inputs.upload }}
        run: dotnet build $PROJECT -p:MobileTargets=$TARGETS -f net10.0-ios -c Debug -p:RuntimeIdentifier=iossimulator-arm64 -p:ValidateXcodeVersion=false -v:n 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Importa certificato di distribuzione
        if: ${{ inputs.upload }}
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_P12_PASSWORD }}

      - name: Scarica provisioning profile App Store
        if: ${{ inputs.upload }}
        uses: apple-actions/download-provisioning-profiles@v4
        with:
          bundle-id: com.fabioamodeo.dndmanager
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

      - name: Publish IPA firmato
        if: ${{ inputs.upload }}
        run: |
          dotnet publish $PROJECT -p:MobileTargets=$TARGETS -f net10.0-ios -c Release \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:ArchiveOnBuild=true \
            -p:CodesignKey="Apple Distribution" \
            -p:ApplicationVersion=${{ github.run_number }} \
            -p:ValidateXcodeVersion=false \
            -o out 2>&1 | tee build.log
          test ${PIPESTATUS[0]} -eq 0
          IPA=$(ls out/*.ipa | head -1)
          echo "IPA=$IPA" >> "$GITHUB_ENV"

      - name: Carica su TestFlight
        if: ${{ inputs.upload }}
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: ${{ env.IPA }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

      - name: Riepilogo errori di build
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          { grep -E -B3 -A25 "Unhandled exception|Fatal error|IL1012" build.log; grep -E "error [A-Z]+[0-9]+" build.log; } | cut -c1-300 | awk '!seen[$0]++' | head -150 > errors.txt || true
          if [ -s errors.txt ]; then
            MSG=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' errors.txt)
            echo "::error title=Errori di compilazione::$MSG"
          fi
          # salva il log completo sul branch ci-logs (consultabile anche senza accesso ai log di Actions)
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          cp build.log "/tmp/${{ github.workflow }}-build.log"
          git fetch origin ci-logs 2>/dev/null && git checkout -B ci-logs origin/ci-logs || git checkout --orphan ci-logs
          git rm -rf --cached . >/dev/null 2>&1 || true
          cp "/tmp/${{ github.workflow }}-build.log" "${{ github.workflow }}-build.log"
          git add "${{ github.workflow }}-build.log"
          git commit -m "log run ${{ github.run_number }}" && git push -f origin ci-logs || true

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.upload }}
        with:
          name: ios-${{ github.run_number }}
          path: out/*.ipa
